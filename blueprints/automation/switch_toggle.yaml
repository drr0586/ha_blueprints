blueprint:
  name: Wall switch toggles light
  description: >
    A detached wall switch (Shelly input) toggles lights every time it is
    flipped, in either direction. Ignores unavailable/unknown so reboots and
    Wi-Fi drops don't flip lights.
  domain: automation
  source_url: https://github.com/drr0586/ha_blueprints/blob/main/blueprints/automation/switch_toggle.yaml
  input:
    switch_input:
      name: Switch input (binary sensor)
      selector:
        entity:
          filter:
            - domain: binary_sensor
    lights:
      name: Lights
      selector:
        target:
          entity:
            - domain: light

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input switch_input
    from: ["on", "off"]
    to: ["on", "off"]

actions:
  - action: light.toggle
    target: !input lights
