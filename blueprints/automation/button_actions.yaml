blueprint:
  name: Button actions (single / double / long)
  description: >
    Run different actions for single, double and long presses of a
    Matter/Shelly button exposed as an event entity.
  domain: automation
  source_url: https://github.com/drr0586/ha_blueprints/blob/main/blueprints/automation/button_actions.yaml
  input:
    button:
      name: Button (event entity)
      selector:
        entity:
          filter:
            - domain: event
    single_press:
      name: Single press
      default: []
      selector: { action: {} }
    double_press:
      name: Double press
      default: []
      selector: { action: {} }
    long_press:
      name: Long press
      default: []
      selector: { action: {} }

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input button
    not_from: unavailable
    not_to: unavailable

conditions:
  - "{{ trigger.from_state is not none }}"

variables:
  press: "{{ trigger.to_state.attributes.event_type }}"

actions:
  - choose:
      - conditions: "{{ press == 'multi_press_1' }}"
        sequence: !input single_press
      - conditions: "{{ press == 'multi_press_2' }}"
        sequence: !input double_press
      - conditions: "{{ press == 'long_press' }}"
        sequence: !input long_press
